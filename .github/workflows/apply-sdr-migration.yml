name: Apply SDR Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY_SDR_MIGRATION to execute the SQL against Supabase production"
        required: true
        type: string

jobs:
  apply:
    if: inputs.confirm == 'APPLY_SDR_MIGRATION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SDR migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: xusdhzwfkzufupjwbebt
          MIGRATION_FILE: supabase/migrations/20260913024000_sdr_conversations.sql
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -f "$MIGRATION_FILE"
          jq -n --rawfile query "$MIGRATION_FILE" '{query: $query}' > /tmp/sdr-migration.json
          curl -fsS \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/sdr-migration.json
