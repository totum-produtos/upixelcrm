name: PR Quality Gate

# Gate de qualidade em todo pull request para main (Plano BuildOps, Fase 1, item 1.1).
# Não faz deploy de nada: o deploy de edge functions continua no deploy.yml (push em main)
# e o frontend continua na integração GitHub↔Vercel (preview por PR).

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Lint (0 erros exigidos)
        run: npm run lint

      - name: Typecheck (tsc strict, 0 erros exigidos)
        run: npm run typecheck

      - name: Testes + cobertura (vitest)
        run: npm run test:coverage

      - name: Cobertura no resumo do PR
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["## Cobertura (lib, services, hooks)", "", "| Métrica | % | Cobertos |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build de verificação
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_META_APP_ID: ${{ secrets.VITE_META_APP_ID }}
          VITE_META_FB_PAGE_CONFIG_ID: ${{ secrets.VITE_META_FB_PAGE_CONFIG_ID }}
          VITE_META_WHATSAPP_CONFIG_ID: ${{ secrets.VITE_META_WHATSAPP_CONFIG_ID }}
          VITE_ROOT_DOMAIN: ${{ secrets.VITE_ROOT_DOMAIN }}

  # E2E sem backend: o build aponta para 127.0.0.1:9 (porta fechada) e os testes bloqueiam
  # qualquer request para fora do preview local. Nunca toca em Supabase real.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E
        run: npm run test:e2e

      - name: Upload do relatório do Playwright (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
